name: browser verify
on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "lib/**"
      - "e2e/**"
      - "proxy.ts"
      - "package.json"
      - "playwright.config.ts"
      - ".github/workflows/browser-verify.yml"
      - "AI_HANDOFF.md" # run browser checks when runtime acceptance handoff changes
  pull_request:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
